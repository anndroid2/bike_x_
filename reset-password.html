<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BikeX – Új jelszó megadása</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .site-search { width: min(240px, 100%) !important; height: 38px; padding: 0 .8rem 0 2.2rem !important; border: 1px solid #374151 !important; border-radius: .5rem !important; background: #1f2937 !important; color: white !important; outline: none; font: inherit; font-size: .85rem; }
    .site-search:focus { border-color: #60a5fa !important; box-shadow: 0 0 0 3px rgba(96,165,250,.12); }
    .site-search::placeholder { color: #6b7280; }
    body { font-family: 'Inter', sans-serif; background: #0a0e1a; color: white; min-height: 100vh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }
    .bg-pattern { position: fixed; inset: 0; background: radial-gradient(ellipse at 20% 50%, rgba(59,130,246,.12) 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, rgba(139,92,246,.1) 0%, transparent 50%); pointer-events: none; }
    .nav { background: rgba(17,24,39,.8); backdrop-filter: blur(10px); border-bottom: 1px solid #1f2937; padding: 0 2rem; display: flex; align-items: center; height: 60px; }
    .logo { font-size: 1.4rem; font-weight: 800; background: linear-gradient(135deg,#3b82f6,#8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .card { background: #1f2937; border: 1px solid #374151; border-radius: 1rem; padding: 2.5rem; width: 100%; max-width: 420px; }
    .card-title { font-size: 1.6rem; font-weight: 800; margin-bottom: .3rem; }
    .card-sub { color: #9ca3af; font-size: .9rem; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1.1rem; }
    .form-label { display: block; font-size: .85rem; color: #9ca3af; margin-bottom: .4rem; }
    .form-input { width: 100%; background: #111827; border: 1px solid #374151; border-radius: .5rem; padding: .7rem 1rem; color: white; font-size: .95rem; outline: none; transition: border-color .2s; }
    .form-input:focus { border-color: #3b82f6; }
    .btn-primary { width: 100%; background: linear-gradient(135deg,#3b82f6,#8b5cf6); color: white; border: none; padding: .85rem; border-radius: .6rem; font-weight: 700; font-size: 1rem; cursor: pointer; transition: opacity .2s; margin-top: .5rem; }
    .btn-primary:hover { opacity: .9; }
    .error-msg { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: #f87171; border-radius: .5rem; padding: .65rem .9rem; font-size: .85rem; margin-bottom: 1rem; display: none; }
    .error-msg.show { display: block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
</head>
<body>
<div class="bg-pattern"></div>

  <nav class="nav" style="display:flex;align-items:center;justify-content:space-between;">
  <a href="index.html" class="logo">🚲 BikeX</a>
  <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
    <a href="index.html" class="nav-link">Főoldal</a>
    <a href="marketplace.html" class="nav-link">Piactér</a>
    <a href="analytics.html" class="nav-link">Analytics</a>
    <a href="shows.html" class="nav-link">Versenyek</a>
    <a href="parks.html" class="nav-link">Parkok</a>
    <a href="travel.html" class="nav-link">Utazás</a>
    <a href="profile.html" class="nav-link">Profil</a>
  </div>
  <form action="marketplace.html" method="get" style="display:flex;align-items:center;position:relative;">
    <span style="position:absolute;left:.8rem;color:#6b7280;">🔍</span>
    <input name="q" type="search" class="site-search" placeholder="Keresés..." />
  </form>
</nav>

<main class="main">
  <div class="card">
    <h1 class="card-title">Új jelszó megadása 🔑</h1>
    <p class="card-sub">Add meg az új jelszavad a fiókodhoz</p>

    <div class="error-msg" id="errorMsg"></div>

    <div class="form-group">
      <label class="form-label">Új jelszó</label>
      <input type="password" class="form-input" id="passInput" placeholder="Min. 6 karakter" />
    </div>
    <div class="form-group">
      <label class="form-label">Új jelszó megerősítése</label>
      <input type="password" class="form-input" id="pass2Input" placeholder="••••••••" />
    </div>

    <button class="btn-primary" id="submitBtn" onclick="doReset()">Jelszó mentése</button>
  </div>
</main>

<script>
  // A Supabase a link megnyitásakor recovery sessiont hoz létre.
  sb.auth.onAuthStateChange(function (event, session) {
    if (event === 'PASSWORD_RECOVERY') {
      return;
    }
  });

  async function doReset() {
    var p1 = document.getElementById('passInput').value;
    var p2 = document.getElementById('pass2Input').value;
    var err = document.getElementById('errorMsg');

    var session = await getSession();
    if (!session) {
      err.textContent = 'A visszaállító link lejárt vagy érvénytelen. Kérj új linket!';
      err.classList.add('show');
      return;
    }
    if (!p1 || p1.length < 6) { err.textContent = 'A jelszónak legalább 6 karakternek kell lennie!'; err.classList.add('show'); return; }
    if (p1 !== p2) { err.textContent = 'A két jelszó nem egyezik!'; err.classList.add('show'); return; }

    err.classList.remove('show');
    var btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Mentés...';

    var result = await sb.auth.updateUser({ password: p1 });

    btn.disabled = false; btn.textContent = 'Jelszó mentése';

    if (result.error) { err.textContent = result.error.message; err.classList.add('show'); return; }

    bikexToast('Jelszó sikeresen módosítva! Átirányítás...');
    setTimeout(function () { window.location.href = 'profile.html'; }, 1200);
  }
</script>
</body>
</html>
