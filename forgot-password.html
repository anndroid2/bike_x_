<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BikeX – Jelszó visszaállítása</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #0a0e1a; color: white; min-height: 100vh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }
    .bg-pattern { position: fixed; inset: 0; background: radial-gradient(ellipse at 20% 50%, rgba(59,130,246,.12) 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, rgba(139,92,246,.1) 0%, transparent 50%); pointer-events: none; }
    .nav { background: rgba(17,24,39,.8); backdrop-filter: blur(10px); border-bottom: 1px solid #1f2937; padding: 0 2rem; display: flex; align-items: center; height: 60px; }
    .logo { font-size: 1.4rem; font-weight: 800; background: linear-gradient(135deg,#3b82f6,#8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .card { background: #1f2937; border: 1px solid #374151; border-radius: 1rem; padding: 2.5rem; width: 100%; max-width: 420px; }
    .card-title { font-size: 1.6rem; font-weight: 800; margin-bottom: .5rem; }
    .card-sub { color: #9ca3af; font-size: .9rem; line-height: 1.55; margin-bottom: 1.75rem; }
    .form-label { display: block; font-size: .85rem; color: #9ca3af; margin-bottom: .4rem; }
    .form-input { width: 100%; background: #111827; border: 1px solid #374151; border-radius: .5rem; padding: .7rem 1rem; color: white; font-size: .95rem; outline: none; }
    .form-input:focus { border-color: #3b82f6; }
    .btn-primary { width: 100%; background: linear-gradient(135deg,#3b82f6,#8b5cf6); color: white; border: none; padding: .85rem; border-radius: .6rem; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 1.25rem; }
    .btn-primary:disabled { opacity: .65; cursor: wait; }
    .message { display: none; border-radius: .5rem; padding: .7rem .9rem; font-size: .85rem; line-height: 1.45; margin-bottom: 1rem; }
    .message.show { display: block; }
    .message.error { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: #f87171; }
    .message.success { background: rgba(34,197,94,.1); border: 1px solid rgba(74,222,128,.3); color: #86efac; }
    .back-link { display: block; text-align: center; color: #9ca3af; font-size: .86rem; margin-top: 1.25rem; }
    .back-link:hover { color: white; }
    @media (max-width: 640px) { .nav { padding: 0 1rem; } .main { padding: 1rem; } .card { padding: 2rem 1.5rem; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
</head>
<body>
<div class="bg-pattern"></div>
<nav class="nav"><a href="index.html" class="logo">BikeX</a></nav>

<main class="main">
  <section class="card">
    <h1 class="card-title">Jelszó visszaállítása</h1>
    <p class="card-sub">Add meg a regisztrált email címedet. Küldünk egy linket, ahol megadhatod az új jelszavadat.</p>
    <div class="message error" id="errorMsg"></div>
    <div class="message success" id="successMsg">Elküldtük a visszaállító linket az email címedre. Nézd meg a beérkező leveleidet!</div>
    <label class="form-label" for="emailInput">Email cím</label>
    <input type="email" class="form-input" id="emailInput" placeholder="pelda@email.hu" onkeydown="if(event.key==='Enter')sendResetEmail()" />
    <button class="btn-primary" id="submitBtn" onclick="sendResetEmail()">Visszaállító email küldése</button>
    <a class="back-link" href="login.html">Vissza a bejelentkezéshez</a>
  </section>
</main>

<script>
  async function sendResetEmail() {
    var email = document.getElementById('emailInput').value.trim();
    var error = document.getElementById('errorMsg');
    var success = document.getElementById('successMsg');
    var button = document.getElementById('submitBtn');
    error.classList.remove('show');
    success.classList.remove('show');
    if (!email) {
      error.textContent = 'Add meg az email címedet!';
      error.classList.add('show');
      return;
    }
    button.disabled = true;
    button.textContent = 'Küldés...';
    var result = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.bikexPublicUrl + '/reset-password.html'
    });
    button.disabled = false;
    button.textContent = 'Visszaállító email küldése';
    if (result.error) {
      error.textContent = result.error.message;
      error.classList.add('show');
      return;
    }
    success.classList.add('show');
  }
</script>
</body>
</html>
